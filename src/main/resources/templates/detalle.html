<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Inventario</title>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/styles.css}" href="../static/styles.css"></head>
<body>

<header>
    <div class="bar">
        <a class="brand" th:href="@{/}" href="#">Inventario</a>
        <nav>
            <a th:href="@{/}" href="#">Inicio</a>
            <a class="on" th:href="@{/productos}" href="#">Productos</a>
            <a th:href="@{/productos/nuevo}" href="#">Nuevo producto</a>
        </nav>
    </div>
</header>

<main>
    <a class="link back" th:href="@{/productos}">Volver a productos</a>
    <div class="detail">
        <div class="thumb" th:text="${p.inicial}"></div>
        <div>
            <span class="tag" th:classappend="${p.claseEstado}" th:text="${p.estadoStock}"></span>
            <h1 th:text="${p.nombre}"></h1>
            <p class="muted" th:text="${p.categoria} + ' · ' + ${p.codigoSku}"></p>
            <p class="desc" th:text="${p.descripcion}" style="margin-top:14px"></p>

            <dl class="facts">
                <div><dt>Precio</dt><dd th:text="'$' + ${#numbers.formatDecimal(p.precio,1,'COMMA',2,'POINT')}"></dd></div>
                <div><dt>Stock actual</dt><dd th:text="${p.stockActual}"></dd></div>
                <div><dt>Stock mínimo</dt><dd th:text="${p.stockMinimo}"></dd></div>
                <div><dt>Valor en inventario</dt><dd th:text="'$' + ${#numbers.formatDecimal(p.valorEnInventario,1,'COMMA',2,'POINT')}"></dd></div>
                <div><dt>Fecha de registro</dt><dd th:text="${p.fechaRegistro}"></dd></div>
            </dl>
        </div>
    </div>
</main>



</body>
</html>

<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Inventario</title>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/styles.css}" href="../static/styles.css"></head>
<body>

<header>
    <div class="bar">
        <a class="brand" th:href="@{/}" href="#">Inventario</a>
        <nav>
            <a th:href="@{/}" href="#">Inicio</a>
            <a th:href="@{/productos}" href="#">Productos</a>
            <a class="on" th:href="@{/productos/nuevo}" href="#">Nuevo producto</a>
        </nav>
    </div>
</header>

<main>
    <section id="v-formulario">
        <div class="formgrid">
            <div>
                <h1 id="formTitulo">Nuevo producto</h1>
                <p class="muted" id="formSub">Completa los datos básicos. Podrás editarlos después.</p>

                <form class="panel" id="form" th:action="@{/productos}" th:object="${producto}" method="post" novalidate>
                    <div class="row2">
                        <div class="field" data-f="sku">
                            <label for="sku">Código (SKU)</label>
                            <input id="sku" th:field="*{codigoSku}" type="text">
                            <div class="err" th:if="${#fields.hasErrors('codigoSku')}" th:errors="*{codigoSku}"></div>
                        </div>
                        <div class="field" data-f="categoria">
                            <label for="categoria">Categoría</label>
                            <input id="categoria" th:field="*{categoria}" type="text" list="cats">
                            <datalist id="cats">
                                <!-- Categorías dinámicas -->
                            </datalist>
                            <div class="err" th:if="${#fields.hasErrors('categoria')}" th:errors="*{categoria}"></div>
                        </div>
                    </div>

                    <div class="field" data-f="nombre">
                        <label for="nombre">Nombre</label>
                        <input id="nombre" th:field="*{nombre}" type="text">
                        <div class="err" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>

                    </div>

                    <div class="field">
                        <label for="descripcion">Descripción</label>
                        <textarea id="descripcion" th:field="*{descripcion}" rows="3" placeholder="Opcional"></textarea>
                    </div>

                    <div class="row2">
                        <div class="field" data-f="precio">
                            <label for="precio">Precio (MXN)</label>
                            <input id="precio" th:field="*{precio}" type="number" step="0.01" min="0">
                            <div class="err" th:if="${#fields.hasErrors('precio')}" th:errors="*{precio}"></div>

                        </div>
                        <div class="field">
                            <label for="imagen">Imagen (URL)</label>
                            <input id="imagen" th:field="*{imagenUrl}" type="url" placeholder="Opcional">
                        </div>
                    </div>

                    <div class="row2">
                        <div class="field" data-f="stock">
                            <label for="stock">Stock actual</label>
                            <input id="stock" th:field="*{stockActual}" type="number" min="0" step="1">
                            <div class="err" th:if="${#fields.hasErrors('stockActual')}" th:errors="*{stockActual}"></div>

                        </div>
                        <div class="field" data-f="minimo">
                            <label for="minimo">Stock mínimo</label>
                            <input id="minimo" th:field="*{stockMinimo}" type="number" min="0" step="1">
                            <small>Avisamos cuando baje de aquí.</small>
                            <div class="err" th:if="${#fields.hasErrors('stockMinimo')}" th:errors="*{stockMinimo}"></div>
                        </div>
                    </div>

                    <div class="err" th:if="${#fields.hasErrors('stockMinimo')}" th:errors="*{stockMinimo}"></div>

                    <div class="actions">
                        <button class="btn" type="submit">Guardar producto</button>
                        <a class="btn ghost" th:href="@{/productos}">Cancelar</a>
                    </div>

                </form>
            </div>

            <aside class="preview">
                <h2>Así se verá</h2>
                <div class="card">
                    <div class="thumb" id="pvThumb">?</div>
                    <h3 id="pvNombre" style="font-size:20px">Nombre del producto</h3>
                    <p class="muted" id="pvCat" style="margin-bottom:12px">Categoría</p>
                    <div style="display:flex;justify-content:space-between;align-items:center">
                        <b id="pvPrecio">$0.00</b>
                        <span class="tag ok" id="pvEstado">Disponible</span>
                    </div>
                </div>
            </aside>
        </div>
    </section>
</main>

</body>
</html>
